[project]
name = "doc-intel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.137.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "openai>=3.28.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
doc-intel = "doc_intel:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
